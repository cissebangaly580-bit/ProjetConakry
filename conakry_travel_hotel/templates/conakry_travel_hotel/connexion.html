{% extends 'conakry_travel_hotel/base.html' %}

{% block title %}Connexion - Conakry Travel & Hôtel{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-logo">🌍</div>
    <h1 class="login-title">Conakry Travel & Hôtel</h1>
    <p class="login-subtitle">Système de Gestion Intégrée</p>
    
    <form method="post" action="{% url 'connexion' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">👤 Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required>
        </div>
        
        <div class="form-group">
            <label for="password">🔒 Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
        </div>
        
        <button type="submit" class="btn-submit btn-submit-full">Se connecter</button>
    </form>
    
    <p class="login-footer">
        Licence 3 Informatique | Guinée 2025/2026
    </p>
</div>
{% endblock %}
