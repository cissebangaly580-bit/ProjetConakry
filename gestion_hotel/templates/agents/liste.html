{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👷 Liste des Agents</h2>
    <a href="/agents/ajouter" class="btn btn-success">+ Ajouter</a>
</div>

<table class="table table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Login</th>
            <th>Rôle</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for agent in agents %}
        <tr>
            <td>{{ agent[0] }}</td>
            <td>{{ agent[1] }}</td>
            <td>{{ agent[2] }}</td>
            <td>{{ agent[3] }}</td>
            <td>{{ agent[4] }}</td>
            <td>
                <a href="/agents/modifier/{{ agent[0] }}" class="btn btn-warning btn-sm">✏️ Modifier</a>
                <a href="/agents/supprimer/{{ agent[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('Confirmer la suppression ?')">🗑️ Supprimer</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
