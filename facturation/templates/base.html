<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conakry Travel & Hôtel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #1a5276;
            padding: 10px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-size: 14px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a5276;
            border-bottom: 2px solid #1a5276;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th {
            background-color: #1a5276;
            color: white;
            padding: 10px;
            text-align: left;
        }
        table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        table tr:hover {
            background-color: #f0f4f8;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-green { background-color: #27ae60; color: white; }
        .btn-blue  { background-color: #2980b9; color: white; }
        .btn-red   { background-color: #e74c3c; color: white; }
        .messages  { padding: 10px; margin-bottom: 15px; }
        .messages .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; }
        .messages .error   { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <strong>🌍 Conakry Travel & Hôtel</strong>
    <div>
        <a href="/accueil/">🏠 Accueil</a>
        <a href="/clients/">👥 Clients</a>
        <a href="/voyages/">✈️ Voyages</a>
        <a href="/hotel/">🏨 Hôtel</a>
        <a href="/reservations/">📋 Réservations</a>
        <a href="/factures/historique/">🧾 Factures</a>
        <a href="/deconnexion/">🚪 Déconnexion</a>
    </div>
</div>

<!-- CONTENU -->
<div class="container">

    <!-- Messages Django -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
