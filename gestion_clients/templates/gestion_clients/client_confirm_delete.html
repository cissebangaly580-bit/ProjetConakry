{% extends 'conakry_travel_hotel/base.html' %}

{% block title %}Supprimer client - Conakry Travel & Hôtel{% endblock %}

{% block content %}
<h1>Supprimer le client</h1>
<p>Voulez-vous vraiment supprimer le client <strong>{{ client.prenom }} {{ client.nom }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-submit btn-danger">Supprimer</button>
    <a href="{% url 'client_detail' client.pk %}" class="btn-submit btn-secondary">Annuler</a>
</form>
{% endblock %}
